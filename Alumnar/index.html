<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Alumnar</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="color-filter.svg" alt="Alumnar Logo"/>
            </div>
            <ul class="nav-left">
                <li><a href="#">Alumnar</a></li>
            </ul>
            <div class="searchbox">
                <ion-icon name="search" class="search-icon"></ion-icon>
                <form action="/search" method="GET" class="search-bar">
                    <input type="text" name="query" placeholder="Search profile..." required>
                    <button type="submit">Search</button>
                </form>
            </div>
            <ul class="nav-right">
                <li><a href="#">Events</a></li>
                <li><a href="#">Financial Aid</a></li>
                <li><a href="#">Contact Us</a></li>
                <li><a href="#">Sign in</a></li>
                <li><a href="#">Sign up</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="Console">
            Horizontal Toggle Bar
        </div>
    </div>
    <h1 class="welcome">Welcome to Alumnar</h1>
    
    
</body>
</html>
